<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Macro Nutrient Tracker</title>
<meta name="theme-color" content="#e8b830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macro Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card2: #16213e;
  --accent: #e8b830;
  --green: #27ae60;
  --green-light: #a9dfbf;
  --orange: #f39c12;
  --red: #e74c3c;
  --red-dark: #c0392b;
  --text: #ecf0f1;
  --text-dim: #95a5a6;
  --border: #2c3e50;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}
h1 { text-align:center; color:var(--accent); margin-bottom:20px; font-size:1.6em; }

/* Tabs */
.tabs {
  display:flex; gap:4px; margin-bottom:20px; justify-content:center; flex-wrap:wrap;
}
.tab-btn {
  padding:10px 24px; border:none; border-radius:8px 8px 0 0;
  cursor:pointer; font-size:0.95em; font-weight:600;
  transition:all .2s; color:#fff;
}
.tab-btn.work { background:#1e5631; }
.tab-btn.work.active { background:var(--green); }
.tab-btn.rest { background:#5a1a1a; }
.tab-btn.rest.active { background:var(--red); }
.tab-btn.test { background:#5a3e0a; }
.tab-btn.test.active { background:var(--orange); }

.tab-content { display:none; }
.tab-content.active { display:block; }

/* Config section */
.config-grid {
  display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap:12px; margin-bottom:20px; background:var(--card); padding:16px;
  border-radius:12px; border:1px solid var(--border);
}
.config-item { text-align:center; }
.config-item label { display:block; font-size:0.75em; color:var(--text-dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.config-item input {
  width:80px; padding:8px; border-radius:6px; border:1px solid var(--border);
  background:var(--card2); color:var(--accent); text-align:center;
  font-size:1.1em; font-weight:bold;
}
.config-item .computed {
  font-size:1.3em; font-weight:bold; color:var(--accent);
  background:var(--card2); padding:8px; border-radius:6px;
}

/* Dashboard */
.dashboard {
  display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:12px; margin-bottom:20px;
}
.dash-card {
  background:var(--card); border-radius:12px; padding:16px; text-align:center;
  border:2px solid var(--border); transition:all .3s;
}
.dash-card .macro-name { font-size:0.8em; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
.dash-card .macro-value { font-size:2em; font-weight:bold; margin:8px 0; }
.dash-card .macro-target { font-size:0.85em; color:var(--text-dim); }
.dash-card .macro-bar { height:8px; background:#2c3e50; border-radius:4px; margin-top:10px; overflow:hidden; }
.dash-card .macro-bar-fill { height:100%; border-radius:4px; transition:width .4s, background .4s; }
.dash-card .macro-gkg { font-size:0.75em; color:var(--text-dim); margin-top:4px; }

.dash-card.status-green { border-color:var(--green); }
.dash-card.status-green-light { border-color:var(--green-light); }
.dash-card.status-orange { border-color:var(--orange); }
.dash-card.status-red { border-color:var(--red); }
.dash-card.status-red-dark { border-color:var(--red-dark); }

/* Kcal card */
.kcal-card {
  background:var(--card); border-radius:12px; padding:16px; text-align:center;
  border:2px solid var(--accent); margin-bottom:20px;
}
.kcal-card .kcal-value { font-size:2.5em; font-weight:bold; color:var(--accent); }
.kcal-card .kcal-label { font-size:0.8em; color:var(--text-dim); text-transform:uppercase; }

/* Meals table */
.meals-section { margin-bottom:20px; }
.meal-group {
  background:var(--card); border-radius:12px; margin-bottom:12px;
  border:1px solid var(--border); overflow:hidden;
}
.meal-header {
  padding:10px 16px; font-weight:bold; font-size:0.9em;
  text-transform:uppercase; letter-spacing:1px;
  display:flex; justify-content:space-between; align-items:center;
}
.meal-header.col { background:#1e3a5f; }
.meal-header.mer1 { background:#2d4a1e; }
.meal-header.pranzo { background:#4a2d1e; }
.meal-header.mer2 { background:#3a1e4a; }
.meal-header.cena { background:#1e4a4a; }
.meal-subtotal { font-size:0.8em; color:var(--accent); }

.food-row {
  display:grid; grid-template-columns: 1fr 80px 70px 70px 70px 70px 36px;
  gap:6px; padding:6px 12px; align-items:center; border-top:1px solid var(--border);
}
.food-row .food-calcs { display:none; }
.food-row:hover { background:rgba(255,255,255,0.03); }
.food-row select, .food-row input {
  padding:6px 8px; border-radius:6px; border:1px solid var(--border);
  background:var(--card2); color:var(--text); font-size:0.85em;
}
.food-row select { cursor:pointer; }
.food-row .calc { text-align:center; font-size:0.85em; color:var(--text-dim); }
.food-row .remove-btn {
  background:none; border:none; color:var(--red); cursor:pointer;
  font-size:1.2em; opacity:0.6; transition:opacity .2s;
}
.food-row .remove-btn:hover { opacity:1; }

.add-food-btn {
  width:100%; padding:8px; background:var(--card2); border:1px dashed var(--border);
  color:var(--text-dim); cursor:pointer; border-radius:0 0 12px 12px;
  font-size:0.85em; transition:all .2s;
}
.add-food-btn:hover { background:var(--border); color:var(--text); }

/* Legend */
.legend {
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  margin-bottom:20px; font-size:0.75em;
}
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot { width:12px; height:12px; border-radius:3px; }

/* Footer */
.footer { text-align:center; color:var(--text-dim); font-size:0.75em; margin-top:30px; }

/* Distribution bar */
.dist-bar-container { margin-bottom:20px; }
.dist-bar { display:flex; height:24px; border-radius:6px; overflow:hidden; background:var(--card); }
.dist-segment { display:flex; align-items:center; justify-content:center; font-size:0.7em; font-weight:bold; color:#fff; transition:width .4s; }
.dist-labels { display:flex; justify-content:center; gap:16px; margin-top:6px; font-size:0.75em; color:var(--text-dim); }

@media (max-width: 700px) {
  body { padding: 10px; }
  h1 { font-size: 1.3em; margin-bottom: 14px; }
  .food-row {
    grid-template-columns: 1fr 30px;
    gap: 6px;
    padding: 10px 12px;
  }
  .food-row select {
    grid-column: 1 / 2;
    font-size: 1em;
    padding: 10px;
    min-height: 44px;
  }
  .food-row input {
    grid-column: 1 / 2;
    font-size: 1em;
    padding: 10px;
    min-height: 44px;
    width: 100%;
  }
  .food-row .remove-btn {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
    align-self: center;
    font-size: 1.5em;
    min-height: 44px;
    min-width: 30px;
  }
  .food-row .calc {
    display: none;
  }
  .food-row .food-calcs {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-around;
    background: var(--card2);
    border-radius: 6px;
    padding: 6px;
    font-size: 0.8em;
    color: var(--text-dim);
  }
  .config-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .config-item input { width: 100%; min-height: 44px; font-size: 1em; }
  .dashboard { grid-template-columns: 1fr; }
  .dash-card .macro-value { font-size: 1.6em; }
  .tab-btn { padding: 12px 16px; font-size: 0.9em; }
  .kcal-card .kcal-value { font-size: 2em; }
  .add-food-btn { padding: 14px; font-size: 1em; min-height: 48px; }
  .meal-header { padding: 12px 16px; }
  .legend { font-size: 0.7em; gap: 8px; }
  .dist-segment { font-size: 0.65em; }
}
</style>
</head>

const DAY_TYPES = ['work', 'rest', 'test'];

const DEFAULT_CONFIG = {
  work: { peso: 86.5, prot: 1.7, grassi: 0.6, carbo: 3.0, targetKcal: 2100 },
  rest: { peso: 86.5, prot: 1.7, grassi: 0.7, carbo: 2.0, targetKcal: 1800 },
  test: { peso: 86.5, prot: 2.0, grassi: 0.8, carbo: 2.5, targetKcal: 2000 }
};

let state = loadState();

function loadState() {
  try {
    const saved = localStorage.getItem('macroTracker_v2');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return getDefaultState();
}

function getDefaultState() {
  const s = {};
  DAY_TYPES.forEach(day => {
    s[day] = {
      config: {...DEFAULT_CONFIG[day]},
      meals: {}
    };
    MEALS.forEach(meal => {
      s[day].meals[meal] = [{ food: '', grams: '' }];
    });
  });
  return s;
}

function saveState() {
  try {
    localStorage.setItem('macroTracker_v2', JSON.stringify(state));
  } catch(e) {}
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn.${tab}`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function renderAll() {
  DAY_TYPES.forEach(day => renderDay(day));
}

function renderDay(day) {
  const container = document.getElementById(`tab-${day}`);
  const cfg = state[day].config;

  // Calculate totals

        const f = FOODS_DB.find(x => x.name === item.food);

          const g = parseFloat(item.grams) || 0;
          totKcal += g/100 * f.kcal;

          totProt += g/100 * f.prot;
          totGrassi += g/100 * f.grassi;

    });

  const minCarbo = cfg.peso * cfg.carbo;

  const pctCarbo = minCarbo > 0 ? totCarbo / minCarbo : 0;

  function getStatus(pct) {
    if (pct >= 1) return 'green';
    if (pct >= 0.9) return 'green-light';
    if (pct >= 0.7) return 'orange';
    if (pct >= 0.5) return 'red';
    return 'red-dark';
  }

  function getColor(status) {
    const map = { green:'var(--green)', 'green-light':'var(--green-light)', orange:'var(--orange)', red:'var(--red)', 'red-dark':'var(--red-dark)' };
    return map[status];
  }

  // Distribution
  const totMacroKcal = totCarbo*4 + totProt*4 + totGrassi*9;
  const distCarbo = totMacroKcal > 0 ? (totCarbo*4/totMacroKcal*100) : 0;
  const distProt = totMacroKcal > 0 ? (totProt*4/totMacroKcal*100) : 0;
  const distGrassi = totMacroKcal > 0 ? (totGrassi*9/totMacroKcal*100) : 0;

  let html = '';

  // Config
  const targetKcal = cfg.targetKcal || 2000;
  html += `<div class="config-grid">
    <div class="config-item"><label>Peso (kg)</label><input type="number" step="0.1" value="${cfg.peso}" onchange="updateConfig('${day}','peso',this.value)"></div>
    <div class="config-item"><label>Proteine (g/kg)</label><input type="number" step="0.1" value="${cfg.prot}" onchange="updateConfig('${day}','prot',this.value)"></div>
    <div class="config-item"><label>Grassi (g/kg)</label><input type="number" step="0.1" value="${cfg.grassi}" onchange="updateConfig('${day}','grassi',this.value)"></div>
    <div class="config-item"><label>Carboidrati (g/kg)</label><input type="number" step="0.1" value="${cfg.carbo}" onchange="updateConfig('${day}','carbo',this.value)"></div>
    <div class="config-item"><label>Target Kcal</label><input type="number" step="50" value="${targetKcal}" onchange="updateConfig('${day}','targetKcal',this.value)"></div>
    <div class="config-item"><label>Min Prot (g)</label><div class="computed">${minProt.toFixed(0)}</div></div>
    <div class="config-item"><label>Min Grassi (g)</label><div class="computed">${minGrassi.toFixed(0)}</div></div>
    <div class="config-item"><label>Min Carbo (g)</label><div class="computed">${minCarbo.toFixed(0)}</div></div>
  </div>`;

  // Kcal with target comparison
  const kcalDiff = totKcal - targetKcal;
  const kcalPct = targetKcal > 0 ? totKcal / targetKcal : 0;
  let kcalStatus = '', kcalColor = '';
  if (totKcal === 0) { kcalStatus = ''; kcalColor = 'var(--text-dim)'; }
  else if (kcalPct >= 0.95 && kcalPct <= 1.05) { kcalStatus = 'IN TARGET'; kcalColor = 'var(--green)'; }
  else if (kcalPct < 0.95) { kcalStatus = `${kcalDiff.toFixed(0)} kcal sotto`; kcalColor = 'var(--orange)'; }
  else { kcalStatus = `+${kcalDiff.toFixed(0)} kcal sopra`; kcalColor = 'var(--red)'; }
  const kcalBarWidth = Math.min(kcalPct * 100, 120);
  html += `<div class="kcal-card" style="border-color:${totKcal > 0 ? kcalColor : 'var(--accent)'}">
    <div class="kcal-label">Kcal Totali / Target: ${targetKcal}</div>
    <div class="kcal-value">${totKcal.toFixed(0)} <span style="font-size:0.5em;color:${kcalColor}">${kcalStatus}</span></div>
    <div class="macro-bar" style="margin-top:10px"><div class="macro-bar-fill" style="width:${Math.min(kcalBarWidth,100)}%;background:${kcalColor}"></div></div>
    <div style="font-size:0.75em;color:var(--text-dim);margin-top:4px">${(kcalPct*100).toFixed(0)}% del target</div>
  </div>`;

  // Dashboard
  const macros = [
    { name:'Proteine', total:totProt, min:minProt, pct:pctProt, gkg: cfg.peso>0 ? totProt/cfg.peso : 0 },
    { name:'Grassi', total:totGrassi, min:minGrassi, pct:pctGrassi, gkg: cfg.peso>0 ? totGrassi/cfg.peso : 0 },
    { name:'Carboidrati', total:totCarbo, min:minCarbo, pct:pctCarbo, gkg: cfg.peso>0 ? totCarbo/cfg.peso : 0 },
  ];

  html += `<div class="dashboard">`;
  macros.forEach(m => {
    const status = getStatus(m.pct);
    const color = getColor(status);
    const barWidth = Math.min(m.pct * 100, 100);
    html += `<div class="dash-card status-${status}">
      <div class="macro-name">${m.name}</div>
      <div class="macro-value" style="color:${color}">${m.total.toFixed(1)}g</div>
      <div class="macro-target">obiettivo: ${m.min.toFixed(0)}g &middot; ${(m.pct*100).toFixed(0)}%</div>
      <div class="macro-gkg">${m.gkg.toFixed(2)} g/kg</div>
      <div class="macro-bar"><div class="macro-bar-fill" style="width:${barWidth}%;background:${color}"></div></div>
    </div>`;
  });
  html += `</div>`;

  // Distribution bar
  if (totMacroKcal > 0) {
    html += `<div class="dist-bar-container">
      <div class="dist-bar">
        <div class="dist-segment" style="width:${distCarbo}%;background:#3498db">C ${distCarbo.toFixed(0)}%</div>
        <div class="dist-segment" style="width:${distProt}%;background:#e74c3c">P ${distProt.toFixed(0)}%</div>
        <div class="dist-segment" style="width:${distGrassi}%;background:#f39c12">G ${distGrassi.toFixed(0)}%</div>
      </div>
      <div class="dist-labels"><span>Carbo: ${distCarbo.toFixed(0)}%</span><span>Prot: ${distProt.toFixed(0)}%</span><span>Grassi: ${distGrassi.toFixed(0)}%</span></div>
    </div>`;
  }

  // Meals
  html += `<div class="meals-section">`;
  const mealClasses = ['col','mer1','pranzo','mer2','cena'];
  MEALS.forEach((meal, mi) => {
    // Calculate meal subtotals
    let mKcal=0, mC=0, mP=0, mG=0;
    meals[meal].forEach(item => {
      if (item.food && item.grams) {
        const f = FOODS_DB.find(x => x.name === item.food);
        if (f) {
          const g = parseFloat(item.grams)||0;
          mKcal += g/100*f.kcal; mC += g/100*f.carbo; mP += g/100*f.prot; mG += g/100*f.grassi;
        }
      }
    });

    html += `<div class="meal-group">
      <div class="meal-header ${mealClasses[mi]}">
        <span>${meal}</span>
        <span class="meal-subtotal">${mKcal.toFixed(0)} kcal | C:${mC.toFixed(0)} P:${mP.toFixed(0)} G:${mG.toFixed(0)}</span>
      </div>`;

    meals[meal].forEach((item, idx) => {
      const f = item.food ? FOODS_DB.find(x => x.name === item.food) : null;
      const g = parseFloat(item.grams) || 0;
      const kcal = f ? (g/100*f.kcal).toFixed(0) : '-';
      const carbo = f ? (g/100*f.carbo).toFixed(1) : '-';
      const prot = f ? (g/100*f.prot).toFixed(1) : '-';
      const grassi = f ? (g/100*f.grassi).toFixed(1) : '-';

      html += `<div class="food-row">
        <select onchange="updateFood('${day}','${meal}',${idx},this.value)">
          <option value="">-- scegli --</option>
          ${FOODS_DB.map(fd => `<option value="${fd.name}" ${fd.name===item.food?'selected':''}>${fd.name}</option>`).join('')}
        </select>
        <input type="number" placeholder="grammi" value="${item.grams}" onchange="updateGrams('${day}','${meal}',${idx},this.value)">
        <div class="calc">${kcal}</div>
        <div class="calc">${carbo}</div>
        <div class="calc">${prot}</div>
        <div class="calc">${grassi}</div>
        <button class="remove-btn" onclick="removeFood('${day}','${meal}',${idx})">&times;</button>
        <div class="food-calcs">${f ? `${kcal} kcal &middot; C:${carbo} &middot; P:${prot} &middot; G:${grassi}` : ''}</div>
      </div>`;
    });

    html += `<button class="add-food-btn" onclick="addFood('${day}','${meal}')">+ Aggiungi alimento</button>`;
    html += `</div>`;
  });
  html += `</div>`;

  container.innerHTML = html;
}

// ===================== ACTIONS =====================
function updateConfig(day, key, value) {
  state[day].config[key] = parseFloat(value) || 0;
  saveState();
  renderDay(day);
}

function updateFood(day, meal, idx, value) {
  state[day].meals[meal][idx].food = value;
  saveState();
  renderDay(day);
}

function updateGrams(day, meal, idx, value) {
  state[day].meals[meal][idx].grams = value;
  saveState();
  renderDay(day);
}

function addFood(day, meal) {
  state[day].meals[meal].push({ food:'', grams:'' });
  saveState();
  renderDay(day);
}

function removeFood(day, meal, idx) {
  state[day].meals[meal].splice(idx, 1);
  if (state[day].meals[meal].length === 0) {
    state[day].meals[meal].push({ food:'', grams:'' });
  }
  saveState();
  renderDay(day);
}

// Initial render
renderAll();

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log('SW registered'))
    .catch(e => console.log('SW failed', e));
}
</script>
</body>
</html>
